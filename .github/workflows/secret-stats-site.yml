name: Poser le secret des statistiques du site (bilans vendeurs)

# Recopie le secret SITE_STATS_KEY depuis les secrets GitHub vers les
# secrets du Worker Cloudflare (même mécanisme que le SSO Kadima). Studio
# Bilans s'en sert pour lire les vues par annonce sur le site Kadima.
# Déclenchement MANUEL (onglet Actions → Run workflow).
#
# À poser AVANT (Settings → Secrets and variables → Actions) :
#   SITE_STATS_KEY         la même valeur que la variable STUDIO_STATS_KEY
#                          du service Render « kadima-admin »
#   CLOUDFLARE_API_TOKEN   déjà posé pour le déploiement
#
# Pour RETIRER le secret (Studio ne lit plus les stats du site) :
#   cocher « Retirer le secret » ci-dessous.

on:
  workflow_dispatch:
    inputs:
      retirer:
        description: "Retirer le secret au lieu de le poser"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  secret:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier ce qu'on a sous la main
        env:
          K: ${{ secrets.SITE_STATS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant."
            exit 1
          fi
          if [ "${{ inputs.retirer }}" = "true" ]; then exit 0; fi
          if [ -z "$K" ]; then
            echo "::error::Secret GitHub SITE_STATS_KEY manquant — posez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `wrangler secret put` lit la valeur sur l'entrée standard : elle ne
      # passe donc jamais par la ligne de commande, où elle serait visible.
      - name: Poser le secret
        if: ${{ inputs.retirer != true }}
        working-directory: server
        env:
          K: ${{ secrets.SITE_STATS_KEY }}
        run: printf '%s' "$K" | npx --yes wrangler@4 secret put SITE_STATS_KEY

      - name: Retirer le secret
        if: ${{ inputs.retirer == true }}
        working-directory: server
        run: npx --yes wrangler@4 secret delete SITE_STATS_KEY || echo "SITE_STATS_KEY n'était pas posé."

      - name: Vérifier que le SSO répond (401 attendu sur un faux jeton)
        if: ${{ inputs.retirer != true }}
        run: |
          # La propagation Cloudflare peut prendre quelques secondes : on
          # laisse jusqu'à une minute avant de conclure à l'échec.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' --data '{"pass":"invalide.test"}' \
              https://studio-brochure-api.studiobrochure.workers.dev/auth/kadima)
            echo "essai $i : auth/kadima → $code"
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          echo "::error::Le serveur répond $code (attendu 401) — secret non pris en compte."
          exit 1
