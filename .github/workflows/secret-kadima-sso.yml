name: Poser le secret Accès collaborateur (SSO Kadima)

# Recopie le secret KADIMA_SSO_SECRET depuis les secrets GitHub vers les
# secrets du Worker Cloudflare (même mécanisme que les accès Microsoft).
# Déclenchement MANUEL (onglet Actions → Run workflow).
#
# À poser AVANT (Settings → Secrets and variables → Actions) :
#   KADIMA_SSO_SECRET      la même valeur que la variable KADIMA_SSO_SECRET
#                          du service Render « kadima-admin »
#   CLOUDFLARE_API_TOKEN   déjà posé pour le déploiement
#
# Pour RETIRER le secret (désactiver le SSO côté serveur) :
#   cocher « Retirer le secret » ci-dessous.

on:
  workflow_dispatch:
    inputs:
      retirer:
        description: "Retirer le secret au lieu de le poser"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  secret:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier ce qu'on a sous la main
        env:
          K: ${{ secrets.KADIMA_SSO_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant."
            exit 1
          fi
          if [ "${{ inputs.retirer }}" = "true" ]; then exit 0; fi
          if [ -z "$K" ]; then
            echo "::error::Secret GitHub KADIMA_SSO_SECRET manquant — posez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `wrangler secret put` lit la valeur sur l'entrée standard : elle ne
      # passe donc jamais par la ligne de commande, où elle serait visible.
      - name: Poser le secret
        if: ${{ inputs.retirer != true }}
        working-directory: server
        env:
          K: ${{ secrets.KADIMA_SSO_SECRET }}
        run: printf '%s' "$K" | npx --yes wrangler@4 secret put KADIMA_SSO_SECRET

      - name: Retirer le secret
        if: ${{ inputs.retirer == true }}
        working-directory: server
        run: npx --yes wrangler@4 secret delete KADIMA_SSO_SECRET || echo "KADIMA_SSO_SECRET n'était pas posé."

      - name: Vérifier que le SSO répond (401 attendu sur un faux jeton)
        if: ${{ inputs.retirer != true }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data '{"pass":"invalide.test"}' \
            https://studio-brochure-api.studiobrochure.workers.dev/auth/kadima)
          echo "auth/kadima → $code"
          [ "$code" = "401" ] || { echo "::error::Le serveur répond $code (attendu 401) — secret non pris en compte."; exit 1; }
