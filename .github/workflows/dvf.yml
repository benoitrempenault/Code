name: DVF (ventes par commune)

# Les ventes DVF que lisent le livret prix, Studio Estimation, la carte de
# prospection et le guide R2.
#
# Etalab ne publie plus de fichier par commune : seulement des fichiers
# NATIONAUX, un par an (dont le semestre en cours), deux fois l'an (avril et
# octobre). Les anciens fichiers par commune sont figés et annoncés supprimés
# fin novembre 2026. Ce travail télécharge les fichiers nationaux, les découpe
# par commune pour les départements demandés et les dépose dans le stockage de
# Studio (R2, dvf/<année>/<département>/<commune>.csv), d'où le serveur les sert.
#
# Le dépôt passe par le serveur avec une clé JETABLE : posée au début, remplacée
# par une autre (jamais divulguée) à la fin. Sans clé connue, le dépôt est fermé.
# Les données DVF sont publiques : rien de confidentiel dans les journaux.
#
# Lancement à la main : onglet Actions → ce workflow → « Run workflow ».
#   departements : « 33 » (plusieurs : « 33,24,40 »). Ajouter un département
#   garde ceux déjà en place.
# Tous les mois, il vérifie s'il y a une nouvelle livraison ; sinon il ne fait rien.

on:
  schedule:
    - cron: "17 4 25 * *"
  workflow_dispatch:
    inputs:
      departements:
        description: "Départements à couvrir (ex. 33 ou 33,24,40)"
        default: "33"
        required: true
      forcer:
        description: "Tout redéposer, même si la livraison est déjà en place"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dvf
  cancel-in-progress: false

jobs:
  dvf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_NO_WARNINGS: "1"
    steps:
      - name: Vérifier la présence du jeton
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La clé est tirée au hasard, masquée dans le journal, et ne sert qu'à ce
      # passage. `wrangler secret put` la lit sur l'entrée standard.
      - name: Ouvrir le dépôt (clé jetable)
        working-directory: server
        run: |
          CLE="$(openssl rand -hex 32)"
          echo "::add-mask::$CLE"
          echo "DEPOT_KEY=$CLE" >> "$GITHUB_ENV"
          printf '%s' "$CLE" | npx --yes wrangler@4 secret put DVF_DEPOT_KEY
          sleep 20

      - name: Découper les fichiers nationaux et les déposer
        env:
          DEPARTEMENTS: ${{ inputs.departements || '33' }}
          FORCER: ${{ inputs.forcer || 'false' }}
          DEPOT_URL: https://studio-brochure-api.studiobrochure.workers.dev
        run: node tools/dvf/decouper-dvf.mjs

      # Toujours : la clé qui a servi est remplacée par une autre, que personne ne connaît.
      - name: Refermer le dépôt
        if: always()
        working-directory: server
        run: openssl rand -hex 32 | tr -d '\n' | npx --yes wrangler@4 secret put DVF_DEPOT_KEY
