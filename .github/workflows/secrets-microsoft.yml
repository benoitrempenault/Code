name: Poser les accès Microsoft sur le serveur

# Recopie les trois accès Microsoft depuis les secrets GitHub vers les secrets
# du Worker Cloudflare. Déclenchement MANUEL (onglet Actions → Run workflow).
#
# Pourquoi passer par là : les secrets du Worker se posent normalement avec
# `wrangler secret put`, donc un terminal. Ici, les valeurs vivent dans les
# secrets GitHub (masqués dans les journaux, jamais affichés) et ce workflow
# les recopie. Rien n'est écrit dans le dépôt.
#
# Secrets à poser AVANT (Settings → Secrets and variables → Actions) :
#   GRAPH_TENANT_ID        « ID de l'annuaire (locataire) » de l'application
#   GRAPH_CLIENT_ID        « ID d'application (client) »
#   GRAPH_CLIENT_SECRET    la VALEUR du secret client (visible une seule fois
#                          à sa création — pas son « ID secret »)
#   CLOUDFLARE_API_TOKEN   déjà posé pour le déploiement
#
# Pour RETIRER les accès (et rendre le serveur inerte à nouveau) :
#   cocher « Retirer les accès » ci-dessous.

on:
  workflow_dispatch:
    inputs:
      retirer:
        description: "Retirer les accès Microsoft au lieu de les poser"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier ce qu'on a sous la main
        env:
          T: ${{ secrets.GRAPH_TENANT_ID }}
          C: ${{ secrets.GRAPH_CLIENT_ID }}
          S: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant."
            exit 1
          fi
          if [ "${{ inputs.retirer }}" = "true" ]; then exit 0; fi
          manque=""
          [ -z "$T" ] && manque="$manque GRAPH_TENANT_ID"
          [ -z "$C" ] && manque="$manque GRAPH_CLIENT_ID"
          [ -z "$S" ] && manque="$manque GRAPH_CLIENT_SECRET"
          if [ -n "$manque" ]; then
            echo "::error::Secrets GitHub manquants :$manque — posez-les dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `wrangler secret put` lit la valeur sur l'entrée standard : elle ne
      # passe donc jamais par la ligne de commande, où elle serait visible.
      - name: Poser les trois accès
        if: ${{ inputs.retirer != true }}
        working-directory: server
        env:
          T: ${{ secrets.GRAPH_TENANT_ID }}
          C: ${{ secrets.GRAPH_CLIENT_ID }}
          S: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: |
          printf '%s' "$T" | npx --yes wrangler@4 secret put GRAPH_TENANT_ID
          printf '%s' "$C" | npx --yes wrangler@4 secret put GRAPH_CLIENT_ID
          printf '%s' "$S" | npx --yes wrangler@4 secret put GRAPH_CLIENT_SECRET

      - name: Retirer les trois accès
        if: ${{ inputs.retirer == true }}
        working-directory: server
        run: |
          for k in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET; do
            npx --yes wrangler@4 secret delete "$k" || echo "$k n'était pas posé."
          done

      # Le serveur se rebranche tout seul au redémarrage du Worker : on force
      # une lecture pour vérifier qu'il répond toujours.
      - name: Vérifier que le serveur répond
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://studio-brochure-api.studiobrochure.workers.dev/health)
          echo "health → $code"
          [ "$code" = "200" ] || exit 1
