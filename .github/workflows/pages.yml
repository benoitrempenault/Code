name: Déploiement GitHub Pages

# Publie l'outil Studio Brochure sur GitHub Pages.
# Important : on ne publie QUE l'application (index.html + assets/).
# Les documents clients (.pdf, .docx) présents dans le dépôt ne sont PAS publiés.

on:
  push:
    branches:
      - claude/property-brochure-generator-645oap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (app uniquement)
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -r assets/* _site/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
