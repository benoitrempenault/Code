name: Déploiement GitHub Pages

# Publie l'outil Studio Brochure sur GitHub Pages.
# Important : on ne publie QUE l'application (index.html + assets/).
# Les documents clients (.pdf, .docx) présents dans le dépôt ne sont PAS publiés.

on:
  push:
    branches:
      - claude/property-brochure-generator-645oap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Garde-fou — syntaxe JS (bloque le déploiement si cassé)
        run: |
          set -e
          for f in $(find assets pro mandat mandat-pro suivi permanence rdv administration prospection estimation recrutement -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done
          echo "Syntaxe JS OK — déploiement autorisé."

      - name: Préparer le site (app uniquement)
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp favicon.svg _site/
          cp admin.html _site/            # console d'administration interne (noindex, protégée par ADMIN_KEY)
          cp -r assets/* _site/assets/
          # Studio Immo (version marque blanche, parcours guidé) sous /pro/
          mkdir -p _site/pro/assets
          cp pro/index.html pro/favicon.svg _site/pro/
          cp -r pro/assets/* _site/pro/assets/
          # Studio Mandat (accueil + fiche prestation + brochure) sous /mandat/
          mkdir -p _site/mandat/assets
          cp mandat/index.html mandat/fiche.html mandat/brochure.html mandat/formation.html mandat/favicon.svg _site/mandat/
          cp -r mandat/assets/* _site/mandat/assets/
          # Studio Mandat marque blanche (paramétrage agence) sous /mandat-pro/
          mkdir -p _site/mandat-pro/assets
          cp mandat-pro/index.html mandat-pro/fiche.html mandat-pro/brochure.html mandat-pro/compte.html mandat-pro/formation.html mandat-pro/favicon.svg _site/mandat-pro/
          cp -r mandat-pro/assets/* _site/mandat-pro/assets/
          # Studio Suivi (dossiers de vente compromis → acte, interne Kadima) sous /suivi/
          mkdir -p _site/suivi/assets
          cp suivi/index.html suivi/favicon.svg _site/suivi/
          cp -r suivi/assets/* _site/suivi/assets/
          # Studio Permanence (tour de permanence des points de vente, interne Kadima) sous /permanence/
          mkdir -p _site/permanence/assets
          cp permanence/index.html permanence/favicon.svg _site/permanence/
          cp -r permanence/assets/* _site/permanence/assets/
          # Studio Administration (contacts, anniversaires, annonces — interne Kadima) sous /administration/
          mkdir -p _site/administration/assets
          cp administration/index.html administration/favicon.svg _site/administration/
          cp -r administration/assets/* _site/administration/assets/
          # Studio Prospection (carte + îlots — interne Kadima) sous /prospection/
          mkdir -p _site/prospection/assets
          cp prospection/index.html prospection/favicon.svg _site/prospection/
          cp -r prospection/assets/* _site/prospection/assets/
          # Studio Estimation (la vie du quartier avant RDV) sous /estimation/
          mkdir -p _site/estimation/assets
          cp estimation/index.html estimation/favicon.svg _site/estimation/
          cp -r estimation/assets/* _site/estimation/assets/
          # Studio Recrutement (interface employeur + portail candidat public) sous /recrutement/
          mkdir -p _site/recrutement/assets
          cp recrutement/index.html recrutement/candidat.html recrutement/favicon.svg _site/recrutement/
          cp -r recrutement/assets/* _site/recrutement/assets/
          # Prise de rendez-vous en ligne (page publique appelée par le site de l'agence) sous /rdv/
          mkdir -p _site/rdv/assets
          cp rdv/index.html rdv/favicon.svg _site/rdv/
          cp -r rdv/assets/* _site/rdv/assets/
          # Page de présentation Studio Mandat sous /site-mandat/
          mkdir -p _site/site-mandat/assets
          cp site-mandat/index.html site-mandat/favicon.svg _site/site-mandat/
          cp -r site-mandat/assets/* _site/site-mandat/assets/
          # Site vitrine (promotion Studio Immo) sous /site/
          mkdir -p _site/site/assets
          cp site/index.html site/favicon.svg _site/site/
          cp -r site/assets/* _site/site/assets/
          # Pages légales (mentions, RGPD, CGU/CGV, cookies) sous /legal/
          mkdir -p _site/legal/assets
          cp legal/*.html legal/favicon.svg _site/legal/
          cp -r legal/assets/* _site/legal/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  # ---------------------------------------------------------------------
  # Produit commercial ABR IMMO → dépôt "studiobrochure" (studiobrochure.fr)
  # Racine = site de vente ; /app = Studio Brochure (fiche+brochure+compte) ;
  # /brochure = brochure seule ; /site-brochure = vitrine brochure ; /legal.
  # Aucun contenu Century 21 n'y est copié. Ne tourne que si le secret
  # COMMERCIAL_DEPLOY_TOKEN est configuré.
  commercial:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.COMMERCIAL_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire le site commercial
        run: |
          mkdir -p _commercial
          # Site de vente à la racine
          cp site-mandat/index.html site-mandat/favicon.svg _commercial/
          mkdir -p _commercial/assets && cp -r site-mandat/assets/* _commercial/assets/
          # L'app (ex mandat-pro) sous /app
          mkdir -p _commercial/app/assets
          cp mandat-pro/index.html mandat-pro/fiche.html mandat-pro/brochure.html mandat-pro/compte.html mandat-pro/formation.html mandat-pro/favicon.svg _commercial/app/
          cp -r mandat-pro/assets/* _commercial/app/assets/
          # Brochure seule (ex pro) sous /brochure
          mkdir -p _commercial/brochure/assets
          cp pro/index.html pro/favicon.svg _commercial/brochure/
          cp -r pro/assets/* _commercial/brochure/assets/
          # Vitrine brochure sous /site-brochure
          mkdir -p _commercial/site-brochure/assets
          cp site/index.html site/favicon.svg _commercial/site-brochure/
          cp -r site/assets/* _commercial/site-brochure/assets/
          # Studio Recrutement (marque blanche) sous /recrutement
          mkdir -p _commercial/recrutement/assets
          cp recrutement/index.html recrutement/candidat.html recrutement/favicon.svg _commercial/recrutement/
          cp -r recrutement/assets/* _commercial/recrutement/assets/
          # Légal
          mkdir -p _commercial/legal/assets
          cp legal/*.html legal/favicon.svg _commercial/legal/
          cp -r legal/assets/* _commercial/legal/assets/
          # Réécriture des chemins pour la nouvelle arborescence
          sed -i 's|"\.\./legal/|"legal/|g; s|"\.\./mandat-pro/|"app/|g' _commercial/index.html
          sed -i 's|"\.\./site-mandat/|"../|g' _commercial/legal/*.html
          sed -i 's|"\.\./mandat-pro/|"../app/|g' _commercial/recrutement/index.html
          sed -i 's|"\.\./pro/|"../brochure/|g' _commercial/site-brochure/index.html
          echo "studiobrochure.fr" > _commercial/CNAME
          touch _commercial/.nojekyll

      - name: Publier vers le dépôt studiobrochure
        if: ${{ env.TOKEN != '' }}
        run: |
          cd _commercial
          git init -b gh-pages
          git config user.name "deploy-bot"
          git config user.email "contact@studiobrochure.fr"
          git add -A
          git commit -m "Déploiement $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${TOKEN}@github.com/benoitrempenault/studiobrochure.git" gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
