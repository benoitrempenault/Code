name: Déploiement GitHub Pages

# Publie l'outil Studio Brochure sur GitHub Pages.
# Important : on ne publie QUE l'application (index.html + assets/).
# Les documents clients (.pdf, .docx) présents dans le dépôt ne sont PAS publiés.

on:
  push:
    branches:
      - claude/property-brochure-generator-645oap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (app uniquement)
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -r assets/* _site/assets/
          # Studio Immo (version marque blanche, parcours guidé) sous /pro/
          mkdir -p _site/pro/assets
          cp pro/index.html _site/pro/
          cp -r pro/assets/* _site/pro/assets/
          # Studio Mandat (accueil + fiche prestation + brochure) sous /mandat/
          mkdir -p _site/mandat/assets
          cp mandat/index.html mandat/fiche.html mandat/brochure.html _site/mandat/
          cp -r mandat/assets/* _site/mandat/assets/
          # Studio Mandat marque blanche (paramétrage agence) sous /mandat-pro/
          mkdir -p _site/mandat-pro/assets
          cp mandat-pro/index.html mandat-pro/fiche.html mandat-pro/brochure.html _site/mandat-pro/
          cp -r mandat-pro/assets/* _site/mandat-pro/assets/
          # Page de présentation Studio Mandat sous /site-mandat/
          mkdir -p _site/site-mandat/assets
          cp site-mandat/index.html _site/site-mandat/
          cp -r site-mandat/assets/* _site/site-mandat/assets/
          # Site vitrine (promotion Studio Immo) sous /site/
          mkdir -p _site/site/assets
          cp site/index.html _site/site/
          cp -r site/assets/* _site/site/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
