name: Déploiement de l'API (Cloudflare Workers + D1)

# Déploiement manuel du serveur Studio Brochure : schéma D1 puis Worker.
# Il ne part JAMAIS tout seul sur un push — c'est un geste volontaire.
#
# À faire une seule fois avant le premier lancement :
#   1. Cloudflare → Mon profil → Jetons d'API → « Modifier les Workers »
#      (portée : Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit).
#   2. GitHub → Settings → Secrets and variables → Actions → New secret :
#        CLOUDFLARE_API_TOKEN  = le jeton
#        CLOUDFLARE_ACCOUNT_ID = l'identifiant de compte (tableau de bord Cloudflare)
#   3. Actions → « Déploiement de l'API » → Run workflow.
#
# Le schéma s'applique avec CREATE TABLE IF NOT EXISTS : le rejouer ne détruit
# aucune donnée existante. C'est ce qui ajoute les tables des permanences.

on:
  workflow_dispatch:
    inputs:
      appliquer_schema:
        description: "Appliquer schema.sql sur la base D1 de production"
        type: boolean
        default: true
      deployer:
        description: "Déployer le Worker"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN absent — voir l'en-tête de ce fichier."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Garde-fou — les tests doivent passer avant tout déploiement
        run: npm test

      - name: Appliquer le schéma D1 (production)
        if: ${{ inputs.appliquer_schema }}
        run: npx --yes wrangler@4 d1 execute studio-brochure --remote --file=schema.sql --yes

      - name: Déployer le Worker
        if: ${{ inputs.deployer }}
        run: npx --yes wrangler@4 deploy

      - name: Vérifier que l'API répond
        if: ${{ inputs.deployer }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://studio-brochure-api.studiobrochure.workers.dev/health; then
              echo "" && echo "API en ligne."
              exit 0
            fi
            sleep 5
          done
          echo "::error::L'API ne répond pas sur /health après le déploiement."
          exit 1
