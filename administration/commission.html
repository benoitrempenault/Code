<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.studiobrochure.fr https://studio-brochure-api.studiobrochure.workers.dev https://fonts.googleapis.com https://fonts.gstatic.com" />
  <title>Commission d'évaluation — CENTURY 21 Kadima</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css?v=21" />
  <style>
    .commission { max-width: 560px; margin: 0 auto; padding: 18px 14px 60px; }
    .commission .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; display: block; margin-bottom: 12px; background: var(--line); }
    .commission .bien h2 { margin: 0 0 4px; }
    .commission .infos { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .commission .infos span { background: var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
    .commission .forts { white-space: pre-line; font-size: 14px; color: var(--muted); margin: 8px 0 0; }
    .commission .merci { text-align: center; padding: 40px 10px; font-size: 18px; }
    .commission .merci .grand { font-size: 44px; margin-bottom: 10px; }
  </style>
</head>
<body>
<header class="topbar"><h1>Commission <em>d'évaluation</em></h1></header>
<main class="commission">
  <div class="carte bien" id="bien"><p class="aide">Chargement du bien…</p></div>
  <div class="carte" id="formulaire" hidden>
    <h2>Votre fourchette de prix</h2>
    <p class="aide">Indiquez la fourchette de valeur de ce bien selon vous (net vendeur). Votre avis reste entre conseillers.</p>
    <div class="grille-champs">
      <label>Votre prénom et nom<input id="av-nom" autocomplete="name" /></label>
      <label>Prix bas (€)<input id="av-min" type="number" inputmode="numeric" step="1000" placeholder="300000" /></label>
      <label>Prix haut (€)<input id="av-max" type="number" inputmode="numeric" step="1000" placeholder="320000" /></label>
      <label style="grid-column:1/-1;">Remarque (facultatif)<textarea id="av-note" style="min-height:70px;" placeholder="Ce qui justifie votre fourchette…"></textarea></label>
    </div>
    <div class="barre"><button class="btn btn-or" id="av-envoyer" style="flex:1;">✦ Envoyer ma fourchette</button></div>
    <p class="petit" id="av-etat"></p>
  </div>
  <div class="carte merci" id="merci" hidden><div class="grand">✅</div>Merci ! Votre fourchette est transmise au conseiller.<p class="petit" id="merci-detail"></p></div>
</main>
<div id="toast" class="toast" hidden></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/commission.js?v=21"></script>
</body>
</html>
