<title>Kadymo — Formation & Documents</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --accent:#3D5A80;
  --on-accent:#FFFFFF;
  --bg:color-mix(in oklab, var(--accent) 4%, #FAF9F6);
  --surface:color-mix(in oklab, var(--accent) 1.5%, #FFFFFF);
  --surface-2:color-mix(in oklab, var(--accent) 6%, #F4F2EE);
  --ink:#212936;
  --muted:#5C6675;
  --line:color-mix(in oklab, var(--accent) 10%, #E4E1DB);
  --ok:#2E7D4F;
  --ok-bg:color-mix(in oklab, #2E7D4F 12%, var(--surface));
  --warn:#A66A14;
  --warn-bg:color-mix(in oklab, #A66A14 12%, var(--surface));
  --bad:#B3403A;
  --bad-bg:color-mix(in oklab, #B3403A 10%, var(--surface));
  --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px -12px rgba(20,25,35,.12);
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:color-mix(in oklab, var(--accent) 7%, #121519);
    --surface:color-mix(in oklab, var(--accent) 4%, #1A1F26);
    --surface-2:color-mix(in oklab, var(--accent) 9%, #21262E);
    --ink:#E9E7E2;
    --muted:#9AA3AE;
    --line:color-mix(in oklab, var(--accent) 14%, #2B323C);
    --ok:#5CB884; --ok-bg:color-mix(in oklab, #5CB884 16%, var(--surface));
    --warn:#D9A24C; --warn-bg:color-mix(in oklab, #D9A24C 16%, var(--surface));
    --bad:#E07B72; --bad-bg:color-mix(in oklab, #E07B72 14%, var(--surface));
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --bg:color-mix(in oklab, var(--accent) 4%, #FAF9F6);
  --surface:color-mix(in oklab, var(--accent) 1.5%, #FFFFFF);
  --surface-2:color-mix(in oklab, var(--accent) 6%, #F4F2EE);
  --ink:#212936;
  --muted:#5C6675;
  --line:color-mix(in oklab, var(--accent) 10%, #E4E1DB);
  --ok:#2E7D4F; --ok-bg:color-mix(in oklab, #2E7D4F 12%, var(--surface));
  --warn:#A66A14; --warn-bg:color-mix(in oklab, #A66A14 12%, var(--surface));
  --bad:#B3403A; --bad-bg:color-mix(in oklab, #B3403A 10%, var(--surface));
  --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px -12px rgba(20,25,35,.12);
}
:root[data-theme="dark"]{
  --bg:color-mix(in oklab, var(--accent) 7%, #121519);
  --surface:color-mix(in oklab, var(--accent) 4%, #1A1F26);
  --surface-2:color-mix(in oklab, var(--accent) 9%, #21262E);
  --ink:#E9E7E2;
  --muted:#9AA3AE;
  --line:color-mix(in oklab, var(--accent) 14%, #2B323C);
  --ok:#5CB884; --ok-bg:color-mix(in oklab, #5CB884 16%, var(--surface));
  --warn:#D9A24C; --warn-bg:color-mix(in oklab, #D9A24C 16%, var(--surface));
  --bad:#E07B72; --bad-bg:color-mix(in oklab, #E07B72 14%, var(--surface));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.4rem}h3{font-size:1.12rem}
p{margin:.4em 0 .9em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---- shell ---- */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.15rem;font-weight:700;overflow:hidden;flex-shrink:0}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-name{font-family:var(--font-display);font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-tag{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:7px 10px;font-size:.9rem}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
nav.tabs{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:69px;z-index:19}
nav.tabs button{border:1px solid transparent;background:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.92rem}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs button.active{background:var(--accent);color:var(--on-accent)}
main{max-width:1020px;margin:0 auto;padding:28px 20px 80px}
footer.app-footer{text-align:center;padding:18px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}

/* ---- components ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:.95rem;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.badge.oblig{background:var(--bad-bg);color:var(--bad)}
.badge.reco{background:var(--ok-bg);color:var(--ok)}
.badge.zone{background:var(--warn-bg);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- wizard ---- */
.wizard-progress{height:6px;border-radius:3px;background:var(--surface-2);margin:14px 0 26px;overflow:hidden}
.wizard-progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.opt-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:18px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;transition:border-color .15s, transform .1s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt.selected{border-color:var(--accent);background:color-mix(in oklab, var(--accent) 7%, var(--surface));}
.opt .opt-ico{font-size:1.6rem;display:block;margin-bottom:8px}
.opt .opt-t{font-weight:700;display:block;margin-bottom:3px}
.opt .opt-d{font-size:.83rem;color:var(--muted);display:block}
.wizard-nav{display:flex;justify-content:space-between;margin-top:26px;gap:10px}

/* ---- results / checklist ---- */
.gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{width:92px;height:92px;flex-shrink:0}
.gauge text{font:700 1.05rem var(--font-body);fill:var(--ink)}
.src-group{margin-top:22px}
.src-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.src-ico{width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.src-conseil{font-size:.84rem;color:var(--muted);margin:2px 0 10px;padding-left:48px}
.doc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.doc.done{opacity:.62}
.doc.done .doc-t{text-decoration:line-through}
.doc input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.doc-t{font-weight:600}
.doc-d{font-size:.85rem;color:var(--muted);margin-top:1px}
.doc-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.doc-astuce{font-size:.83rem;background:var(--surface-2);border-left:3px solid var(--accent);padding:7px 11px;border-radius:0 7px 7px 0;margin-top:8px}
.doc-astuce b{color:var(--accent)}

/* ---- formation ---- */
.lesson-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.lesson-card .lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson-body h3{margin-top:1.6em}
.lesson-body ul{padding-left:1.2em}
.lesson-body li{margin:.35em 0}
.script{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;font-size:.93rem}
.script .who{font-weight:700;color:var(--accent)}
.keypoint{border-left:3px solid var(--accent);background:color-mix(in oklab, var(--accent) 6%, var(--surface));padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;font-size:.93rem}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem;margin:12px 0}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
table.cmp th{background:var(--surface-2)}
.table-scroll{overflow-x:auto}

/* ---- entraînement ---- */
.chat{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.bubble{max-width:85%;padding:11px 15px;border-radius:14px;font-size:.94rem}
.bubble.npc{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.bubble .who{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;opacity:.7;margin-bottom:3px;font-weight:700}
.choice-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 15px;font-size:.93rem}
.choice:hover{border-color:var(--accent)}
.fb{border-radius:10px;padding:11px 14px;font-size:.9rem;margin-top:12px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.mid{background:var(--warn-bg);color:var(--warn)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.score-bar{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.score-bar .track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.score-bar .track i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* flashcards */
.fcard{perspective:1000px;min-height:210px;cursor:pointer}
.fcard-inner{position:relative;width:100%;min-height:210px;transition:transform .5s;transform-style:preserve-3d}
.fcard.flipped .fcard-inner{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fface.front{background:var(--surface)}
.fface.back{background:color-mix(in oklab, var(--accent) 7%, var(--surface));transform:rotateY(180deg)}

/* quiz */
.qopt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 15px;margin-bottom:9px;font-size:.94rem}
.qopt:hover{border-color:var(--accent)}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* settings */
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
.field input[type=text],.field select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.field input[type=color]{width:52px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:none}

/* home */
.hero{background:linear-gradient(135deg, color-mix(in oklab, var(--accent) 14%, var(--surface)), var(--surface));border:1px solid var(--line);border-radius:14px;padding:30px 28px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .v{font-size:1.7rem;font-weight:700;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted)}

@media (max-width:640px){
  .topbar{padding:10px 14px}
  nav.tabs{top:61px;padding:8px 12px}
  main{padding:20px 14px 60px}
  .brand-tag{display:none}
}
@media print{
  .topbar,nav.tabs,.no-print,footer.app-footer{display:none !important}
  body{background:#fff;color:#000}
  .card,.doc{box-shadow:none;border-color:#ccc}
  main{max-width:none;padding:0}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

  <div class="brand">
    <div class="brand-logo" id="brandLogo">K</div>

      <div class="brand-name" id="brandName">Kadymo</div>
      <div class="brand-tag" id="brandTag">L'école de vos réussites immobilières</div>
    </div>
  </div>
  <div class="topbar-spacer"></div>
  <button class="iconbtn" id="themeBtn" title="Basculer clair / sombre" aria-label="Basculer le thème">◐</button>
</header>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<main id="app"></main>
<footer class="app-footer" id="appFooter"></footer>

<script>
"use strict";
/* ================= Kadymo — plateforme marque blanche =================
   Un seul fichier, aucune dépendance. Données et rendu en JS pur.       */

const store = {
  get(k, d){ try{ const v = localStorage.getItem("kadymo:"+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("kadymo:"+k, JSON.stringify(v)); }catch(e){} }
};

const DEFAULT_CONFIG = {
  nom: "Kadymo",
  baseline: "L'école de vos réussites immobilières",
  logo: "",            // dataURL éventuel
  accent: "#3D5A80",
  vocab: "conseiller", // conseiller | négociateur | agent
  modules: { documents:true, formation:true, entrainement:true },
  mandatSimple: true   // un réseau 100% exclusif peut masquer les contenus mandat simple
};

let config = Object.assign({}, DEFAULT_CONFIG, store.get("config", {}));
config.modules = Object.assign({}, DEFAULT_CONFIG.modules, config.modules||{});

let progress = Object.assign({ lessonsRead:{}, quizBest:null, simBest:{} }, store.get("progress", {}));

/* vocabulaire marque blanche */
function V(){ return config.vocab || "conseiller"; }
function Vcap(){ const v = V(); return v.charAt(0).toUpperCase()+v.slice(1); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* contraste du texte sur la couleur d'accent */
function onAccent(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#fff";
  const n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const lum = .2126*(r/255)**2.2 + .7152*(g/255)**2.2 + .0722*(b/255)**2.2;
  return lum > .35 ? "#1C2430" : "#FFFFFF";
}

function applyBranding(){
  document.documentElement.style.setProperty("--accent", config.accent);
  document.documentElement.style.setProperty("--on-accent", onAccent(config.accent));
  document.getElementById("brandName").textContent = config.nom;
  document.getElementById("brandTag").textContent = config.baseline;
  const logo = document.getElementById("brandLogo");
  logo.innerHTML = config.logo ? '<img src="'+config.logo+'" alt="Logo '+esc(config.nom)+'">' : esc((config.nom||"K").trim().charAt(0).toUpperCase());
  document.title = config.nom + " — Formation & Documents";
  document.getElementById("appFooter").textContent = config.nom + " · Plateforme de formation immobilière · Contenu pédagogique, ne remplace pas un conseil juridique.";
}

/* thème clair / sombre */
let theme = store.get("theme", "");
function applyTheme(){
  if(theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = theme ? theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark";
  store.set("theme", theme); applyTheme();
});

/* ---------------- navigation ---------------- */
let route = store.get("route", "home");
const app = document.getElementById("app");

function tabsDef(){
  const t = [{id:"home", label:"Accueil"}];
  if(config.modules.documents) t.push({id:"docs", label:"Dossier documents"});
  if(config.modules.formation) t.push({id:"formation", label:"Formation"});
  if(config.modules.entrainement) t.push({id:"training", label:"Entraînement"});
  t.push({id:"settings", label:"Marque blanche"});
  return t;
}
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = tabsDef().map(t =>
    '<button data-r="'+t.id+'" class="'+(route===t.id || route.startsWith(t.id+"/") ? "active":"")+'">'+t.label+'</button>').join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => go(b.dataset.r)));
}
function go(r){
  route = r; store.set("route", r);
  renderTabs(); render();
  window.scrollTo({top:0, behavior:"instant"});
}
</script>
<script>
"use strict";
/* ================= MODULE DOCUMENTS : assistant guidé ================= */

const SOURCES = {
  vendeur:       { label:"Le vendeur",              ico:"🗝️", conseil:"À demander dès le rendez-vous découverte. Donnez la liste par écrit : un vendeur retrouve rarement tout du premier coup. Proposez de l'aider à chercher — c'est aussi un excellent prétexte de re-contact." },
  notaire:       { label:"Le notaire",              ico:"⚖️", conseil:"Le notaire du vendeur détient la copie du titre de propriété et les actes. Écrivez-lui avec l'accord du vendeur ; comptez de quelques jours à deux semaines." },
  syndic:        { label:"Le syndic",               ico:"🏢", conseil:"Certains documents sont payants (pré-état daté notamment). Anticipez : les syndics répondent parfois en plusieurs semaines. Le vendeur peut souvent les télécharger gratuitement depuis son extranet copropriétaire." },
  diagnostiqueur:{ label:"Le diagnostiqueur",       ico:"📐", conseil:"Groupez tous les diagnostics en une seule visite : c'est moins cher et plus rapide. Vérifiez les dates de validité des diagnostics déjà réalisés avant d'en commander de nouveaux." },
  mairie:        { label:"La mairie / l'urbanisme", ico:"🏛️", conseil:"Urbanisme, autorisations de travaux, alignement, assainissement collectif : passez par le service urbanisme de la commune. Beaucoup de communes répondent par mail." },
  enligne:       { label:"Les services en ligne",   ico:"🌐", conseil:"Géorisques (ERP), impots.gouv (taxe foncière), cadastre.gouv (plan cadastral) : le vendeur — ou vous — pouvez les obtenir immédiatement, gratuitement." }
};

/* Questions de l'assistant. `when` masque une question selon les réponses déjà données. */
const QUESTIONS = [
  { id:"type", titre:"Quel type de bien vendez-vous ?", sub:"C'est la première question à poser : elle détermine toute la suite du dossier.",
    opts:[
      {v:"maison",      ico:"🏠", t:"Une maison",      d:"Individuelle ou en lotissement"},
      {v:"appartement", ico:"🏬", t:"Un appartement",  d:"En copropriété dans la quasi-totalité des cas"},
      {v:"terrain",     ico:"🌳", t:"Un terrain",      d:"À bâtir ou non constructible"}

const NIV_LABEL = { oblig:{c:"oblig", t:"Obligatoire"}, reco:{c:"reco", t:"Recommandé"}, zone:{c:"zone", t:"Selon zone / cas"} };

/* état du dossier en cours */
let dossier = store.get("dossier", null); // {answers:{...}, checked:{docId:true}, nom:""}

function visibleQuestions(answers){ return QUESTIONS.filter(q => !q.when || q.when(answers)); }
function docsFor(answers){ return DOCS.filter(d => d.when(answers)); }

function renderDocs(){
  if(!config.modules.documents){ go("home"); return; }
  if(dossier && dossier.done){ renderDocResults(); return; }
  renderWizard();
}

let wizAnswers = null, wizIdx = 0;
function renderWizard(){
  if(!wizAnswers) { wizAnswers = (dossier && !dossier.done) ? dossier.answers : {}; wizIdx = 0; }
  const qs = visibleQuestions(wizAnswers);
  if(wizIdx >= qs.length){ finishWizard(); return; }
  const q = qs[wizIdx];
  const multi = !!q.multi;
  const cur = wizAnswers[q.id];
  app.innerHTML = `
    <div class="eyebrow">Assistant dossier de vente · question ${wizIdx+1} sur ${qs.length}</div>
    <div class="wizard-progress"><i style="width:${Math.round(wizIdx/qs.length*100)}%"></i></div>
    <h1>${q.titre}</h1>
    <p class="muted">${q.sub}</p>
    <div class="opt-grid">
      ${q.opts.map(o => {
        const sel = multi ? (cur||[]).includes(o.v) : cur===o.v;
        return `<button class="opt ${sel?"selected":""}" data-v="${o.v}">
          <span class="opt-ico">${o.ico}</span><span class="opt-t">${o.t}</span><span class="opt-d">${o.d}</span>
        </button>`;
      }).join("")}
    </div>
    <div class="wizard-nav">
      <button class="btn ghost" id="wizBack" ${wizIdx===0?"disabled":""}>← Retour</button>
      ${multi ? '<button class="btn" id="wizNext">Continuer →</button>' : '<span class="muted small" style="align-self:center">Choisissez une réponse pour continuer</span>'}
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if(multi){
      const arr = new Set(wizAnswers[q.id]||[]);
      arr.has(b.dataset.v) ? arr.delete(b.dataset.v) : arr.add(b.dataset.v);
      wizAnswers[q.id] = [...arr];
      b.classList.toggle("selected");
    } else {
      wizAnswers[q.id] = b.dataset.v;
      /* réponses par défaut cohérentes */
      if(q.id==="type" && b.dataset.v==="terrain"){ delete wizAnswers.copro; delete wizAnswers.construction; delete wizAnswers.occupation; delete wizAnswers.equip; delete wizAnswers.travaux; }
      wizIdx++;
      renderWizard();
    }
  }));
  const back = document.getElementById("wizBack");
  if(back) back.addEventListener("click", () => { if(wizIdx>0){ wizIdx--; renderWizard(); } });
  const next = document.getElementById("wizNext");
  if(next) next.addEventListener("click", () => { if(!wizAnswers[q.id]) wizAnswers[q.id]=[]; wizIdx++; renderWizard(); });
}

function finishWizard(){
  dossier = { answers: wizAnswers, checked: (dossier && dossier.checked) || {}, done: true, ts: dossier && dossier.ts || null };
  store.set("dossier", dossier);
  wizAnswers = null; wizIdx = 0;
  renderDocResults();
}

function resumeLabel(a){
  const t = {maison:"Maison", appartement:"Appartement", terrain:"Terrain"}[a.type]||"";
  const bits = [t];
  if(a.copro==="oui") bits.push("copropriété");
  if(a.occupation==="loue") bits.push("loué");
  const v = {seul:"", couple:"couple", succession:"succession", divorce:"divorce", sci:"SCI", protege:"majeur protégé"}[a.vendeur];
  if(v) bits.push(v);
  return bits.join(" · ");
}

function renderDocResults(){
  const a = dossier.answers;
  const docs = docsFor(a);
  const byNiv = {oblig:[],reco:[],zone:[]};
  docs.forEach(d=>byNiv[d.niv].push(d));
  const total = docs.length;
  const done = docs.filter(d => dossier.checked[d.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const bySrc = {};
  docs.forEach(d => { (bySrc[d.src] = bySrc[d.src]||[]).push(d); });
  const circ = 2*Math.PI*40;

  app.innerHTML = `
    <div class="card no-print" style="margin-bottom:20px">
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 100 100" role="img" aria-label="Dossier complet à ${pct}%">
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" transform="rotate(-90 50 50)"/>
          <text x="50" y="55" text-anchor="middle">${pct}%</text>
        </svg>
        <div style="flex:1;min-width:220px">
          <div class="eyebrow">Votre dossier de vente</div>
          <h1 style="margin:.15em 0 .2em">${resumeLabel(a)}</h1>
          <p class="muted small" style="margin:0">${done} document${done>1?"s":""} sur ${total} réuni${done>1?"s":""} —
            ${byNiv.oblig.length} obligatoires, ${byNiv.reco.length} recommandés, ${byNiv.zone.length} selon zone ou cas particulier.</p>
          <div class="pill-row" style="margin-top:12px">
            <button class="btn sm secondary" id="docEdit">✎ Modifier les réponses</button>
            <button class="btn sm secondary" id="docRestart">↺ Nouveau dossier</button>
            <button class="btn sm secondary" id="docCopy">⧉ Copier la liste</button>
            <button class="btn sm secondary" onclick="window.print()">🖨 Imprimer</button>
          </div>
        </div>
      </div>
    </div>
    ${pct===100 ? '<div class="fb good" style="margin-bottom:18px">🎉 Dossier complet ! Vous pouvez commercialiser sereinement — et le montrer au vendeur : un dossier complet, c\'est votre premier argument d\'exclusivité.</div>' : ""}
    ${Object.keys(bySrc).map(src => {
      const s = SOURCES[src];
      const items = bySrc[src];
      const sdone = items.filter(d=>dossier.checked[d.id]).length;
      return `<section class="src-group">
        <div class="src-head">
          <div class="src-ico">${s.ico}</div>
          <div style="flex:1"><h2 style="margin:0">${s.label}</h2></div>
          <span class="chip">${sdone}/${items.length}</span>
        </div>
        <p class="src-conseil">${s.conseil}</p>
        ${items.map(d => `
          <div class="doc ${dossier.checked[d.id]?"done":""}">
            <input type="checkbox" id="ck-${d.id}" data-doc="${d.id}" ${dossier.checked[d.id]?"checked":""} aria-label="Obtenu : ${esc(d.nom)}">
            <div style="flex:1">
              <label class="doc-t" for="ck-${d.id}">${d.nom}</label>
              <div class="doc-d">${d.d}</div>
              <div class="doc-meta">
                <span class="badge ${NIV_LABEL[d.niv].c}">${NIV_LABEL[d.niv].t}</span>
                <span class="chip">⏱ ${d.delai}</span>
              </div>
              <div class="doc-astuce"><b>Astuce ${V()} :</b> ${d.astuce}</div>
            </div>
          </div>`).join("")}
      </section>`;
    }).join("")}
    <p class="muted small" style="margin-top:26px">Liste indicative à visée pédagogique : les obligations exactes dépendent de la commune et de la situation. En cas de doute, validez avec le notaire.</p>`;

  app.querySelectorAll("input[data-doc]").forEach(c => c.addEventListener("change", () => {
    dossier.checked[c.dataset.doc] = c.checked;
    store.set("dossier", dossier);
    renderDocResults();
  }));
  document.getElementById("docEdit").addEventListener("click", () => { wizAnswers = Object.assign({}, dossier.answers); wizIdx = 0; dossier.done = false; renderWizard(); });
  document.getElementById("docRestart").addEventListener("click", () => {
    if(confirm("Repartir de zéro ? Les cases cochées seront effacées.")){ dossier = null; wizAnswers = null; wizIdx = 0; store.set("dossier", null); renderWizard(); }
  });
  document.getElementById("docCopy").addEventListener("click", (e) => {
    const lines = ["Dossier de vente — " + resumeLabel(a), ""];
    Object.keys(bySrc).forEach(src => {
      lines.push("■ " + SOURCES[src].label.toUpperCase());
      bySrc[src].forEach(d => lines.push((dossier.checked[d.id]?"[x] ":"[ ] ") + d.nom + " — " + NIV_LABEL[d.niv].t + " (" + d.delai + ")"));
      lines.push("");
    });
    navigator.clipboard && navigator.clipboard.writeText(lines.join("\n")).then(()=>{ e.target.textContent = "✓ Copié !"; setTimeout(()=>e.target.textContent="⧉ Copier la liste", 1600); });
  });
}
</script>
<script>

    body:`

      <span class="who">4. Questions ouvertes (faites-le parler) :</span> « Comment se passent vos contacts depuis la parution ? Vous avez eu des visites ? Des offres ? Qu'est-ce qui vous ferait dire dans trois mois : c'est réussi ? »<br><br>
      <span class="who">5. Proposer le rendez-vous, à double choix :</span> « Ce que je vous propose, c'est simple et sans engagement : je passe voir le bien, je vous donne mon avis de valeur et le profil de mes acquéreurs. Vous êtes plutôt en semaine en fin de journée, ou le samedi matin ? »</div>
      <h3>Les objections de pige et leurs réponses</h3>

  },

    body:`

  {

    body:`
      <h3>Pourquoi c'est LE rendez-vous stratégique</h3>
      <p>La première cause de perte de mandat n'est pas l'absence de résultat : c'est le <b>silence</b>. Un vendeur sans nouvelles imagine le pire, écoute la concurrence et durcit ses positions. Le bilan de promotion — toutes les 2 à 4 semaines, en face à face si possible — transforme l'attente en pilotage partagé.</p>
      <h3>La structure en 5 temps (30 minutes)</h3>
      <ul>
        <li><b>1. Les actions</b> — ce qui a été fait, preuve à l'appui : diffusions, remontées d'annonce, mailing acquéreurs, panneau… « Voici ce que je vous avais promis, voici ce qui est fait. »</li>
        <li><b>2. Les chiffres</b> — vues de l'annonce, appels, visites, offres. Comparez à la période précédente et aux moyennes de biens similaires : un chiffre isolé ne dit rien.</li>

        <li><b>5. La décision</b> — repartez toujours avec une action datée : ajustement de prix, nouvelles photos, home staging, élargissement de cible… et la date du prochain bilan.</li>

      <div class="keypoint">📊 Annoncez la méthode dès la prise de mandat : « Dans un mois, ce sont les chiffres qui décideront, pas nos opinions. » Le jour du bilan, vous ne vous dédirez pas : vous appliquerez le contrat.</div>
      <h3>Les pièges du bilan</h3>

      <div class="script"><span class="who">${vc} :</span> « J'ai une offre écrite à vous présenter. Avant le montant, laissez-moi vous décrire les acquéreurs : un couple, financement validé à hauteur de X avec apport, souples sur la date, pas de bien à revendre. Ils ont eu un vrai coup de cœur — leurs mots : “...”. Leur offre est de 285 000 €. Elle est à 95 % de notre prix affiché, et au niveau des trois dernières ventes du quartier. Vous avez trois options : accepter, refuser, ou contre-proposer. Je vous donne mon analyse si vous la voulez, mais la décision vous appartient. »</div>
      <h3>Piloter la contre-offre</h3>
      <ul>
        <li>Faites formuler au vendeur son <b>prix plancher réel</b> avant de rappeler l'acquéreur — pas pendant.</li>
        <li>Une contre-offre se justifie : « le vendeur accepte de descendre à X en raison de… » — un chiffre nu invite à re-négocier.</li>
        <li>Cadencez : une offre a une durée de validité. L'urgence douce (« ils visitent autre chose samedi ») est légitime si elle est <b>vraie</b>. Ne mentez jamais sur l'existence d'autres offres.</li>
        <li>En cas d'offres multiples : organisez un tour clair et équitable (« meilleure offre finale pour vendredi 18 h »), informez tout le monde des règles, documentez.</li>
      </ul>
      <h3>Offre acceptée ≠ vente faite</h3>
      <ul>
        <li>Verrouillez immédiatement : acceptation écrite, rendez-vous notaire, calendrier du compromis, pièces manquantes du dossier (voir module Documents !).</li>
        <li>Préparez le vendeur au délai de rétractation (10 jours) et aux conditions suspensives : pas de silence radio entre l'offre et le compromis, c'est la zone où les ventes meurent.</li>

  {
    id:"r1", titre:"La découverte vendeur : le rendez-vous qui décide de tout", min:15, tag:"Fondamentaux",
    resume:"Le premier rendez-vous n'est pas une visite du bien : c'est une découverte du projet. Méthode d'écoute et grille de questions.",
    body:`
      <h3>Inverser la logique</h3>
      <p>Le ${v} débutant visite la maison. Le professionnel découvre le <b>projet</b> : pourquoi vendre, pour aller où, à quelle échéance, avec quelles contraintes ? Le bien n'est que le véhicule du projet. C'est le projet qui signe les mandats.</p>

    body:`
      <h3>Le dossier n'est pas de l'administratif : c'est du commercial</h3>

        <li><b>Il sécurise le délai :</b> un pré-état daté ou un diagnostic SPANC commandé au compromis fait perdre un mois. Commandé au mandat, il ne fait perdre personne.</li>

        <li><b>Il crédibilise le prix :</b> factures de travaux, garanties décennales, charges exactes — chaque pièce transforme une affirmation en preuve.</li>
        <li><b>Il différencie :</b> montrez au vendeur votre méthode (utilisez l'assistant Documents de cette plateforme en rendez-vous !) : « voici les pièces de votre dossier, qui les demande, sous quel délai ». Aucun concurrent en mandat simple ne fera ça.</li>

      <h3>Qui demande quoi : la règle des 3 canaux</h3>

        <li><b>Le vendeur fournit</b> ce qu'il possède : identité, taxe foncière, factures, bail…</li>
        <li><b>Vous commandez</b> ce qui se commande : diagnostics, documents syndic (avec son accord écrit).</li>
        <li><b>Le notaire complète</b> les actes : titre, attestation immobilière, état hypothécaire.</li>
      </ul>
      <p>Fixez la règle au mandat : « chaque semaine, un point sur les pièces manquantes ». C'est un prétexte de contact de plus — et un dossier complet à J+30.</p>`
  }];
  if(!config.mandatSimple){
    return all.filter(l => !["pige","transformation"].includes(l.id));
  }
  return all;
}

function renderFormation(){
  if(!config.modules.formation){ go("home"); return; }
  const lessons = LESSONS();
  const m = route.match(/^formation\/(.+)$/);
  if(m){
    const l = lessons.find(x => x.id===m[1]);
    if(l){ renderLesson(l); return; }
  }
  app.innerHTML = `
    <div class="eyebrow">Formation</div>
    <h1>Les méthodes du métier, leçon par leçon</h1>
    <p class="muted">Des cours courts et concrets, pensés pour un ${V()} débutant. Chaque leçon a son entraînement dans l'onglet suivant.</p>
    <div class="grid cols-2" style="margin-top:20px">
      ${lessons.map(l => `
        <button class="lesson-card" data-l="${l.id}">
          <div class="lc-top"><span class="chip">${l.tag}</span><span class="muted small">⏱ ${l.min} min ${progress.lessonsRead[l.id] ? " · ✅ lu" : ""}</span></div>
          <h3 style="margin:0">${l.titre}</h3>
          <span class="muted small">${l.resume}</span>
        </button>`).join("")}
    </div>`;
  app.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => go("formation/"+b.dataset.l)));
}

function renderLesson(l){
  progress.lessonsRead[l.id] = true; store.set("progress", progress);
  app.innerHTML = `
    <button class="btn ghost sm no-print" id="backF">← Toutes les leçons</button>
    <div style="margin-top:18px" class="eyebrow">${l.tag} · ${l.min} min de lecture</div>
    <h1>${l.titre}</h1>
    <div class="lesson-body card">${l.body}</div>
    <div class="pill-row no-print" style="margin-top:18px">
      ${config.modules.entrainement ? '<button class="btn" id="goTrain">S\'entraîner sur ce thème →</button>' : ""}
      <button class="btn secondary" id="backF2">Retour aux leçons</button>
    </div>`;
  const back = () => go("formation");
  document.getElementById("backF").addEventListener("click", back);
  document.getElementById("backF2").addEventListener("click", back);
  const gt = document.getElementById("goTrain");
  if(gt) gt.addEventListener("click", () => go("training"));
}

/* ----- rendu entraînement ----- */
let sim = null; // {scn, sceneId, score, max, log:[], fb}
let quiz = null; // {i, score, answered}

function renderTraining(){
  if(!config.modules.entrainement){ go("home"); return; }
  const m = route.match(/^training\/(.+)$/);
  if(m){
    if(m[1]==="quiz"){ renderQuiz(); return; }
    if(m[1]==="cartes"){ renderFlash(); return; }
    const scn = SCENARIOS().find(s => s.id===m[1]);
    if(scn){ renderSim(scn); return; }
  }
  sim = null; quiz = null;
  const scns = SCENARIOS();
  app.innerHTML = `
    <div class="eyebrow">Entraînement</div>
    <h1>Entraînez-vous avant d'affronter le terrain</h1>
    <p class="muted">Des mises en situation avec de vrais dialogues : choisissez vos répliques, recevez un retour immédiat, visez le sans-faute. Ici, se tromper ne coûte aucun mandat.</p>
    <h2 style="margin-top:26px">🎭 Mises en situation</h2>
    <div class="grid cols-2">
      ${scns.map(s => {
        const best = progress.simBest[s.id];
        return `<button class="lesson-card" data-r="training/${s.id}">
          <div class="lc-top"><span class="chip">${s.ico} ${s.theme}</span>${best!=null ? '<span class="muted small">Meilleur score : '+best+'%</span>' : '<span class="muted small">Jamais joué</span>'}</div>
          <h3 style="margin:0">${s.titre}</h3>
          <span class="muted small">${s.ctx}</span>
        </button>`;
      }).join("")}
    </div>
    <h2 style="margin-top:30px">🧠 Connaissances</h2>
    <div class="grid cols-2">
      <button class="lesson-card" data-r="training/quiz">
        <div class="lc-top"><span class="chip">❓ Quiz</span>${progress.quizBest!=null ? '<span class="muted small">Meilleur score : '+progress.quizBest+'/'+QUIZ.length+'</span>':''}</div>
        <h3 style="margin:0">Quiz mandats, documents & négociation</h3>
        <span class="muted small">${QUIZ.length} questions corrigées et expliquées, tirées des leçons.</span>
      </button>
      <button class="lesson-card" data-r="training/cartes">
        <div class="lc-top"><span class="chip">🃏 Flashcards</span></div>
        <h3 style="margin:0">Objections vendeurs : les réponses qui marchent</h3>
        <span class="muted small">${FLASHCARDS.length} objections classiques. Formulez votre réponse à voix haute, puis retournez la carte.</span>
      </button>
    </div>`;
  app.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => go(b.dataset.r)));
}

function renderSim(scn){
  if(!sim || sim.scn.id!==scn.id){
    sim = { scn, sceneId:scn.start, score:0, max:0, log:[], fb:null, ended:false };
  }
  const sc = scn.scenes[sim.sceneId];
  const pct = sim.max ? Math.round(sim.score/sim.max*100) : 0;
  app.innerHTML = `
    <button class="btn ghost sm" id="backT">← Entraînements</button>
    <div style="margin-top:16px" class="eyebrow">${scn.ico} Mise en situation · ${scn.theme}</div>
    <h1>${scn.titre}</h1>
    <div class="card" style="margin-bottom:16px"><span class="eyebrow">Contexte</span><p style="margin:.4em 0 0">${scn.ctx}</p></div>
    <div class="score-bar no-print"><span>Score</span><div class="track"><i style="width:${pct}%"></i></div><span style="font-variant-numeric:tabular-nums">${sim.score}/${sim.max||"–"}</span></div>
    <div class="chat" aria-live="polite">
      ${sim.log.map(e => `
        <div class="bubble ${e.who==="npc"?"npc":"me"}"><span class="who">${e.who==="npc"?scn.npcName:"Vous"}</span>${e.txt}</div>
        ${e.fb ? '<div class="fb '+e.cls+'">'+e.fb+'</div>' : ""}`).join("")}
      ${!sim.ended ? '<div class="bubble npc"><span class="who">'+scn.npcName+'</span>'+sc.npc+'</div>' : ""}
    </div>
    ${!sim.ended ? `
      <div class="eyebrow">Que répondez-vous ?</div>
      <div class="choice-list">
        ${sc.choices.map((c,i) => '<button class="choice" data-i="'+i+'">'+c.t+'</button>').join("")}
      </div>` : renderDebrief(scn, pct)}
  `;
  document.getElementById("backT").addEventListener("click", () => { sim=null; go("training"); });
  app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    const c = sc.choices[+b.dataset.i];
    sim.score += c.pts; sim.max += 2;
    sim.log.push({who:"npc", txt:sc.npc});
    sim.log.push({who:"me", txt:c.t, fb:c.fb, cls:c.pts===2?"good":(c.pts===1?"mid":"bad")});
    if(c.next){ sim.sceneId = c.next; } else { sim.ended = true; finishSim(scn); }
    renderSim(scn);
    window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
  }));
  const replay = document.getElementById("simReplay");
  if(replay) replay.addEventListener("click", () => { sim=null; renderSim(scn); window.scrollTo(0,0); });
}
function finishSim(scn){
  const pct = Math.round(sim.score/sim.max*100);
  if(progress.simBest[scn.id]==null || pct > progress.simBest[scn.id]){ progress.simBest[scn.id]=pct; store.set("progress", progress); }
}
function renderDebrief(scn, pct){
  const d = pct>=80 ? scn.debrief.high : (pct>=50 ? scn.debrief.mid : scn.debrief.low);
  return `<div class="card" style="margin-top:10px">
    <div class="eyebrow">Débrief — score final : ${pct}%</div>
    <p style="margin:.5em 0 1em">${d}</p>
    <div class="pill-row">
      <button class="btn" id="simReplay">↺ Rejouer le scénario</button>
    </div>
  </div>`;
}

function renderQuiz(){
  if(!quiz) quiz = { i:0, score:0, answered:false, order:QUIZ.map((_,i)=>i) };
  if(quiz.i >= QUIZ.length){
    if(progress.quizBest==null || quiz.score > progress.quizBest){ progress.quizBest = quiz.score; store.set("progress", progress); }
    const s = quiz.score;
    app.innerHTML = `
      <button class="btn ghost sm" id="backT">← Entraînements</button>
      <h1 style="margin-top:16px">Résultat : ${s} / ${QUIZ.length}</h1>
      <div class="card"><p>${s>=10?"🏆 Excellent — vous maîtrisez les fondamentaux. Passez aux mises en situation pour travailler la posture.":(s>=7?"👍 Bonne base ! Relisez les corrections des questions ratées, puis retentez le sans-faute.":"📚 C'est le moment de (re)lire les leçons de l'onglet Formation — puis revenez : le quiz vous dira si c'est acquis.")}</p>
      <div class="pill-row"><button class="btn" id="quizRestart">↺ Recommencer le quiz</button></div></div>`;
    document.getElementById("backT").addEventListener("click", () => { quiz=null; go("training"); });
    document.getElementById("quizRestart").addEventListener("click", () => { quiz=null; renderQuiz(); });
    return;
  }
  const q = QUIZ[quiz.i];
  app.innerHTML = `
    <button class="btn ghost sm" id="backT">← Entraînements</button>
    <div style="margin-top:16px" class="eyebrow">Quiz · question ${quiz.i+1} / ${QUIZ.length} · score ${quiz.score}</div>
    <div class="wizard-progress"><i style="width:${Math.round(quiz.i/QUIZ.length*100)}%"></i></div>
    <h2>${q.q}</h2>
    <div id="qopts">${q.opts.map((o,i)=>'<button class="qopt" data-i="'+i+'">'+o+'</button>').join("")}</div>
    <div id="qex"></div>`;
  document.getElementById("backT").addEventListener("click", () => { quiz=null; go("training"); });
  app.querySelectorAll(".qopt").forEach(b => b.addEventListener("click", () => {
    if(quiz.answered) return;
    quiz.answered = true;
    const i = +b.dataset.i;
    app.querySelectorAll(".qopt").forEach((x,xi) => { if(xi===q.ok) x.classList.add("correct"); else if(xi===i) x.classList.add("wrong"); });
    if(i===q.ok) quiz.score++;
    document.getElementById("qex").innerHTML = '<div class="fb '+(i===q.ok?"good":"bad")+'">'+(i===q.ok?"✔ Exact. ":"✘ Raté. ")+q.ex+'</div><button class="btn" id="qNext" style="margin-top:14px">Question suivante →</button>';
    document.getElementById("qNext").addEventListener("click", () => { quiz.i++; quiz.answered=false; renderQuiz(); });
  }));
}

function renderFlash(){
  app.innerHTML = `
    <button class="btn ghost sm" id="backT">← Entraînements</button>
    <div style="margin-top:16px" class="eyebrow">Flashcards · objections vendeurs</div>
    <h1>Formulez votre réponse à voix haute, puis retournez la carte</h1>
    <p class="muted small">L'objectif n'est pas de réciter la carte mot à mot, mais de retrouver la <b>technique</b> indiquée en bas de chaque réponse.</p>
    <div class="grid cols-2" style="margin-top:18px">
      ${FLASHCARDS.map((f,i)=>`
        <div class="fcard" data-i="${i}" role="button" tabindex="0" aria-label="Carte objection ${i+1}, cliquer pour retourner">
          <div class="fcard-inner">
            <div class="fface front"><span class="eyebrow">Objection ${i+1}</span><h3 style="margin:0">${f.o}</h3><span class="muted small">Cliquez pour voir une réponse</span></div>
            <div class="fface back"><p class="small" style="margin:0">${f.r}</p><span class="eyebrow" style="margin-top:6px">🎯 ${f.t}</span></div>
          </div>
        </div>`).join("")}
    </div>`;
  document.getElementById("backT").addEventListener("click", () => go("training"));
  app.querySelectorAll(".fcard").forEach(c => {
    const flip = () => c.classList.toggle("flipped");
    c.addEventListener("click", flip);
    c.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } });
  });
}

/* ================= ACCUEIL ================= */

  const read = lessons.filter(l=>progress.lessonsRead[l.id]).length;
  const scns = config.modules.entrainement ? SCENARIOS() : [];
  const played = scns.filter(s=>progress.simBest[s.id]!=null).length;
  let docPct = null;
  if(dossier && dossier.done){
    const ds = docsFor(dossier.answers);
    docPct = ds.length ? Math.round(ds.filter(d=>dossier.checked[d.id]).length/ds.length*100) : 0;
  }
  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">${config.nom}</div>
      <h1>Bienvenue sur votre plateforme de formation</h1>
      <p class="muted" style="max-width:60ch">Tout ce qu'il faut à un ${V()} pour réussir ses premiers mandats : constituer un dossier de vente sans rien oublier, maîtriser les méthodes du métier, et s'entraîner sur des situations réelles — sans risque.</p>
      <div class="pill-row" style="margin-top:14px">
        ${config.modules.documents ? '<button class="btn" data-r="docs">🗂 Préparer un dossier de vente</button>':""}
        ${config.modules.formation ? '<button class="btn secondary" data-r="formation">📖 Suivre une leçon</button>':""}
        ${config.modules.entrainement ? '<button class="btn secondary" data-r="training">🎭 S\'entraîner</button>':""}
      </div>
    </div>
    <div class="grid cols-3">
      ${docPct!=null ? '<div class="stat"><div class="v">'+docPct+'%</div><div class="l">Dossier de vente en cours</div></div>' : (config.modules.documents ? '<div class="stat"><div class="v">–</div><div class="l">Aucun dossier en cours</div></div>':"")}
      ${config.modules.formation ? '<div class="stat"><div class="v">'+read+'/'+lessons.length+'</div><div class="l">Leçons lues</div></div>':""}
      ${config.modules.entrainement ? '<div class="stat"><div class="v">'+played+'/'+scns.length+'</div><div class="l">Mises en situation jouées</div></div>':""}
      ${config.modules.entrainement && progress.quizBest!=null ? '<div class="stat"><div class="v">'+progress.quizBest+'/'+QUIZ.length+'</div><div class="l">Meilleur score au quiz</div></div>':""}
    </div>
    <div class="grid cols-2" style="margin-top:22px">
      ${config.modules.documents ? `<div class="card">
        <h3>🗂 L'assistant dossier de vente</h3>
        <p class="small muted">Répondez à quelques questions — maison ou appartement, copropriété, situation du vendeur… — et obtenez la liste exacte des documents : à qui les demander, sous quel délai, avec une astuce de pro pour chacun.</p>
        <button class="btn sm" data-r="docs">${dossier && dossier.done ? "Reprendre mon dossier →" : "Démarrer un dossier →"}</button>
      </div>`:""}
      ${config.modules.entrainement ? `<div class="card">
        <h3>🎭 Le simulateur de dialogues</h3>
        <p class="small muted">Un appel de pige, une offre à −8 %, un bilan tendu : entraînez-vous sur des conversations réalistes avec retour immédiat sur chaque réplique. Ici, se tromper ne coûte aucun mandat.</p>
        <button class="btn sm" data-r="training">Choisir un scénario →</button>
      </div>`:""}
    </div>`;
  app.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => go(b.dataset.r)));
}

/* ================= MARQUE BLANCHE ================= */
const SWATCHES = ["#3D5A80","#7A2E2E","#1F6E5C","#8A6D1F","#4A3B78","#B4552D","#2B2B2B","#0F5E75"];

function renderSettings(){
  app.innerHTML = `
    <div class="eyebrow">Marque blanche</div>
    <h1>Personnalisez la plateforme à votre enseigne</h1>
    <p class="muted">Tout se met à jour instantanément : nom, logo, couleur, vocabulaire et modules visibles. Les réglages sont conservés sur cet appareil.</p>
    <div class="grid cols-2" style="margin-top:20px">
      <div class="card">
        <h3>Identité</h3>
        <div class="field"><label for="cfgNom">Nom de l'enseigne</label><input type="text" id="cfgNom" value="${esc(config.nom)}" maxlength="40"></div>
        <div class="field"><label for="cfgBase">Baseline (sous le nom)</label><input type="text" id="cfgBase" value="${esc(config.baseline)}" maxlength="70"></div>
        <div class="field"><label for="cfgLogo">Logo (PNG/JPG/SVG, affiché 40×40)</label>
          <input type="file" id="cfgLogo" accept="image/*">
          ${config.logo ? '<button class="btn sm ghost" id="cfgLogoDel" style="margin-top:8px">Retirer le logo</button>' : '<p class="muted small" style="margin-top:6px">Sans logo, l\'initiale de l\'enseigne s\'affiche sur la couleur d\'accent.</p>'}
        </div>
      </div>
      <div class="card">
        <h3>Couleur d'accent</h3>
        <div class="swatches" style="margin-bottom:12px">
          ${SWATCHES.map(c=>'<button class="swatch '+(config.accent.toLowerCase()===c.toLowerCase()?"on":"")+'" style="background:'+c+'" data-c="'+c+'" aria-label="Couleur '+c+'"></button>').join("")}
        </div>
        <div class="field"><label for="cfgColor">Ou choisissez précisément</label><input type="color" id="cfgColor" value="${config.accent}"></div>
        <h3 style="margin-top:20px">Vocabulaire</h3>
        <div class="field"><label for="cfgVocab">Comment appelez-vous vos collaborateurs ?</label>
          <select id="cfgVocab">
            <option value="conseiller" ${config.vocab==="conseiller"?"selected":""}>Conseiller</option>
            <option value="négociateur" ${config.vocab==="négociateur"?"selected":""}>Négociateur</option>
            <option value="agent" ${config.vocab==="agent"?"selected":""}>Agent</option>
          </select>
        </div>
      </div>
      <div class="card">
        <h3>Modules visibles</h3>
        <div class="toggle-row"><span>🗂 Dossier documents</span><input type="checkbox" data-mod="documents" ${config.modules.documents?"checked":""}></div>
        <div class="toggle-row"><span>📖 Formation</span><input type="checkbox" data-mod="formation" ${config.modules.formation?"checked":""}></div>
        <div class="toggle-row"><span>🎭 Entraînement</span><input type="checkbox" data-mod="entrainement" ${config.modules.entrainement?"checked":""}></div>
        <div class="toggle-row"><span>Contenus « mandat simple & pige »<br><span class="muted small">À décocher pour un réseau 100 % exclusivité qui ne souhaite pas les montrer</span></span><input type="checkbox" id="cfgMS" ${config.mandatSimple?"checked":""}></div>
      </div>
      <div class="card">
        <h3>Réinitialiser</h3>
        <p class="muted small">Restaure le nom, la couleur et les modules par défaut. Ne touche ni aux dossiers documents ni aux scores.</p>
        <button class="btn secondary" id="cfgReset">Rétablir les réglages par défaut</button>
      </div>
    </div>`;

  const save = () => { store.set("config", config); applyBranding(); renderTabs(); };
  document.getElementById("cfgNom").addEventListener("input", e => { config.nom = e.target.value || "Kadymo"; save(); });
  document.getElementById("cfgBase").addEventListener("input", e => { config.baseline = e.target.value; save(); });
  document.getElementById("cfgLogo").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    if(f.size > 400*1024){ alert("Image trop lourde (max 400 Ko) : préférez un logo léger."); return; }
    const rd = new FileReader();
    rd.onload = () => { config.logo = rd.result; save(); renderSettings(); };
    rd.readAsDataURL(f);
  });
  const del = document.getElementById("cfgLogoDel");
  if(del) del.addEventListener("click", () => { config.logo=""; save(); renderSettings(); });
  app.querySelectorAll(".swatch").forEach(s => s.addEventListener("click", () => { config.accent = s.dataset.c; save(); renderSettings(); }));
  document.getElementById("cfgColor").addEventListener("input", e => { config.accent = e.target.value; save(); });
  document.getElementById("cfgVocab").addEventListener("change", e => { config.vocab = e.target.value; save(); });
  app.querySelectorAll("[data-mod]").forEach(c => c.addEventListener("change", () => {
    config.modules[c.dataset.mod] = c.checked; save();
  }));
  document.getElementById("cfgMS").addEventListener("change", e => { config.mandatSimple = e.target.checked; save(); });
  document.getElementById("cfgReset").addEventListener("click", () => {
    if(!confirm("Rétablir les réglages par défaut ?")) return;
    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    store.set("config", config); applyBranding(); renderTabs(); renderSettings();
  });
}

/* ================= boot ================= */
function render(){
  if(route==="home") return renderHome();
  if(route==="docs" || route.startsWith("docs/")) return renderDocs();
  if(route==="formation" || route.startsWith("formation/")) return renderFormation();
  if(route==="training" || route.startsWith("training/")) return renderTraining();
  if(route==="settings") return renderSettings();
  route = "home"; renderHome();
}
/* si un module a été masqué alors que la route pointait dessus */
(function(){
  const ok = tabsDef().some(t => route===t.id || route.startsWith(t.id+"/"));
  if(!ok) route = "home";
})();
applyTheme();
applyBranding();
renderTabs();
render();
</script>
